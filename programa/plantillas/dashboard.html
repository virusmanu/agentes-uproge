<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>__LEAFLET_CSS__</style>
<style>
:root{--azul:#0d6abf;--s1:#118DFF;--s2:#12239E;--gris:#E6E6E6;--txt:#252423;--sub:#605E5C;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#3b3a39;font-family:"Segoe UI","Segoe UI Web",Tahoma,Helvetica,Arial,sans-serif;color:var(--txt)}
#escenario{position:relative;margin:0 auto;transform-origin:top left}
.pagina{position:absolute;left:0;top:0;width:1280px;height:720px;background:var(--gris);overflow:hidden;display:none}
.pagina.activa{display:block}
.pagina.blanca{background:#fff}
.v{position:absolute;overflow:hidden}
.marco{background:#fff;border:1px solid var(--azul);border-radius:10px;box-shadow:2px 2px 6px rgba(0,0,0,.25)}
.titulo{font-family:"DIN","D-DIN","Segoe UI Semibold","Segoe UI",sans-serif;font-weight:700;color:var(--azul);text-align:center;line-height:1.15;padding:4px 6px 0}
.cabecera{position:absolute;left:0;top:0;width:1280px;height:60px;background:var(--azul)}
.cabecera .logo{position:absolute;left:2px;top:0;width:65px;height:60px;object-fit:contain}
.cabecera .tt{position:absolute;left:73px;top:4px;height:50px;line-height:50px;color:#fff;font-size:21pt;font-family:"Segoe UI Light","Segoe UI",sans-serif;white-space:nowrap;overflow:hidden}
.seg{position:absolute;top:0;height:60px;color:#fff;font-size:9.5pt;padding:4px 4px 0}
.seg .lbl{margin-bottom:6px;white-space:nowrap}
.seg .caja{background:#fff;color:var(--txt);height:31px;border:1px solid #c8c6c4;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:10.5pt;cursor:pointer;user-select:none}
.seg .caja span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seg .caja svg{flex:none}
.menu{position:fixed;z-index:9999;background:#fff;border:1px solid #c8c6c4;box-shadow:0 4px 12px rgba(0,0,0,.25);max-height:420px;overflow:auto;font-size:10pt;min-width:220px;padding:4px 0;color:var(--txt)}
.menu label{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.menu label:hover{background:#f3f2f1}
.menu .n2{padding-left:26px}.menu .n3{padding-left:44px}
.menu .exp{width:14px;display:inline-block;text-align:center;color:var(--sub);cursor:pointer}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card .val{font-size:20pt;color:var(--txt);white-space:nowrap;max-width:94%;overflow:hidden}
.card .cat{font-size:10pt;font-weight:700;color:var(--azul);margin-top:4px}
table.pv{border-collapse:collapse;width:100%;font-size:9pt}
table.pv th{background:var(--azul);color:#fff;font-weight:700;padding:4px 6px;vertical-align:top;text-align:center;position:sticky;top:0;z-index:2}
table.pv td{padding:2px 5px;white-space:nowrap;text-align:right;position:relative;overflow:hidden;text-overflow:ellipsis}
table.pv.fija{table-layout:fixed}
.titulo{white-space:nowrap;overflow:hidden}
table.pv td.et{text-align:left;border-right:1px solid var(--azul)}
table.pv tr:nth-child(even) td{background:#f0f0f0}
table.pv tr.tot td{font-weight:700;background:#fff;position:sticky;bottom:0;border-top:1px solid #fff;z-index:3}
table.pv tr.n1 td{font-weight:700}
.pm{display:inline-block;width:11px;height:11px;border:1px solid #8a8886;line-height:8px;font-size:10px;text-align:center;margin-right:6px;cursor:pointer;color:#605e5c;background:#fff;vertical-align:-1px}
.barra{position:absolute;left:2px;top:2px;bottom:2px;z-index:0}
td .num{position:relative;z-index:1}
.desliza{overflow:auto;position:absolute}
.desliza::-webkit-scrollbar{width:8px;height:8px}.desliza::-webkit-scrollbar-thumb{background:#c8c6c4;border-radius:4px}
.boton{position:absolute;background:#fff;border:1px solid var(--s2);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:11pt;cursor:pointer;line-height:1.3;padding:4px}
.boton:hover{background:#f3f2f1}
.tile{position:absolute;background:#fff;border:1px solid var(--s2);display:flex;align-items:center;justify-content:center;font-size:10pt;color:#252423;cursor:pointer;text-align:center;padding:4px}
.tile.sel{background:#252423;color:#fff}
.ideas{font-size:11pt;line-height:1.45;white-space:pre-wrap;padding:8px 14px}
#barra-paginas{position:fixed;left:0;right:0;bottom:0;height:34px;background:#f3f2f1;border-top:1px solid #c8c6c4;display:flex;align-items:center;gap:2px;padding:0 10px;font-size:10pt;z-index:50;overflow-x:auto}
#barra-paginas button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:inherit;color:#323130;white-space:nowrap}
#barra-paginas button.act{border-bottom:3px solid var(--s1);font-weight:600}
#barra-paginas .pie{margin-left:auto;color:#605e5c;font-size:8.5pt;white-space:nowrap;padding-left:12px}
svg text{font-family:"Segoe UI",Tahoma,sans-serif}
.tip{position:fixed;z-index:9999;background:#fff;border:1px solid #c8c6c4;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:6px 9px;font-size:9.5pt;pointer-events:none;display:none;line-height:1.4}
.leaflet-container{background:#aad3df}
</style>
</head>
<body>
<div id="escenario"></div>
<div id="barra-paginas"></div>
<div class="tip" id="tip"></div>
<script>__LEAFLET_JS__</script>
<script>
const D = __DATA__;
const IMG = {logoA: "__LOGO_A__", logoB: "__LOGO_B__", franja: "__FRANJA__"};
const C1 = '#118DFF', C2 = '#12239E', AZUL = '#0d6abf';
const ICONO = {alto: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#37A85A" stroke="#2a7a43"/></svg>',
               medio: '<svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,14 1,14" fill="#F2C811" stroke="#b8960c"/></svg>',
               bajo: '<svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15 1,8" fill="#E8584F" stroke="#a83a33"/></svg>'};

// ---------------------------------------------------------------- formato
function fN(v) { if (v === null || v === undefined || isNaN(v)) return ''; const r = Math.round(v); return (r < 0 ? '-' : '') + Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fP(v) { if (v === null || v === undefined || !isFinite(v)) return ''; const t = (v * 100).toFixed(1).split('.'); return t[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + t[1] + ' %'; }
function fP0(v) { return Math.round(v * 100) + '%'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function paso(max, n) { if (max <= 0) return 1; const b = Math.pow(10, Math.floor(Math.log10(max / n))); for (const m of [1, 2, 2.5, 5, 10]) if (max / (b * m) <= n) return b * m; return b * 10; }
function mill(v) { return v === 0 ? '0 mill.' : fN(v / 1e6) + ' mill.'; }

// ---------------------------------------------------------------- datos y filtros
const R = D.filas.map(r => ({s: r[0], p: r[1], t: r[2], st: r[3], it: r[4], as: r[5], c: r[6], m: r[7], ley: r[8], vig: r[9], req: r[10], dev: r[11]}));
const G = D.glosas.map(r => ({s: r[0], p: r[1], g: r[2], ley: r[3], vig: r[4], dev: r[5]}));
const T = D.dic;
const sv = i => T.serv[i], pg = i => T.prog[i], tp = i => T.tipo[i], nst = i => T.st[i], nit = i => T.it[i], nas = i => T.as[i], ngl = i => T.glosa[i];
const reg = c => T.reg[c] || '', mapa = i => T.mapa[i];
const ESTADO = {};   // por página: {serv:Set(prog idx) o null, reg:Set o null, cla:Set de 'st|it|as' o null, glosa:Set o null, tiles:Set o null, inst:...}
function suma(rows, k) { let a = 0; for (const r of rows) a += r[k] || 0; return a; }
function agrupa(rows, key, campos) { const m = new Map(); for (const r of rows) { const k = key(r); let o = m.get(k); if (!o) { o = {k}; for (const c of campos) o[c] = 0; m.set(k, o); } for (const c of campos) o[c] += r[c] || 0; } return [...m.values()]; }
function filtrar(pag, rows) {
  const e = ESTADO[pag] || {};
  return rows.filter(r => (!e.prog || e.prog.has(r.s + '|' + r.p)) && (!e.reg || e.reg.has(r.c)) && (!e.cla || e.cla.has(r.st + '|' + r.it + '|' + r.as)) && (!e.glosa || e.glosa.has(r.g)) && (!e.tiles || e.tiles.has(r.st)));
}

// ---------------------------------------------------------------- tooltip
const TIP = document.getElementById('tip');
function tip(ev, html) { TIP.innerHTML = html; TIP.style.display = 'block'; TIP.style.left = Math.min(ev.clientX + 14, innerWidth - 260) + 'px'; TIP.style.top = (ev.clientY + 12) + 'px'; }
document.addEventListener('mouseover', ev => { const t = ev.target.closest('[data-tip]'); if (t) tip(ev, t.getAttribute('data-tip')); else TIP.style.display = 'none'; });
document.addEventListener('mousemove', ev => { if (TIP.style.display === 'block') { TIP.style.left = Math.min(ev.clientX + 14, innerWidth - 260) + 'px'; TIP.style.top = (ev.clientY + 12) + 'px'; } });

// ---------------------------------------------------------------- elementos
function el(pag, x, y, w, h, cls, html) { const d = document.createElement('div'); d.className = 'v ' + (cls || ''); Object.assign(d.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'}); if (html !== undefined) d.innerHTML = html; pag.appendChild(d); return d; }
function marco(pag, x, y, w, h, titulo, fs) {
  const d = el(pag, x, y, w, h, 'marco'); if (titulo) { const t = document.createElement('div'); t.className = 'titulo'; t.style.fontSize = (fs || 14) + 'pt'; t.textContent = titulo; d.appendChild(t); }
  const c = document.createElement('div'); c.style.cssText = 'position:absolute;left:0;right:0;bottom:0;top:' + (titulo ? Math.round((fs || 14) * 1.333 * 1.15 + 8) : 0) + 'px'; d.appendChild(c); return c;
}
function cabecera(pag, texto, ancho) {
  const h = document.createElement('div'); h.className = 'cabecera'; h.innerHTML = '<img class="logo" src="' + IMG.logoB + '"><div class="tt" style="width:' + (ancho || 1180) + 'px">' + esc(texto) + '</div>'; pag.appendChild(h);
}
// achica la letra hasta que el texto quepa (las fuentes varían entre computadores)
function ajustar(raiz) { (raiz || document).querySelectorAll('.cabecera .tt, .titulo, .card .val').forEach(e => { if (!e.offsetParent && !e.closest('.pagina.activa')) return; let f = parseFloat(getComputedStyle(e).fontSize); let n = 0; while (e.scrollWidth > e.clientWidth + 1 && f > 8 && n++ < 40) { f -= 0.5; e.style.fontSize = f + 'px'; } }); }


// ---------------------------------------------------------------- segmentadores (listas desplegables)
let MENU = null;
document.addEventListener('mousedown', ev => { if (MENU && !MENU.contains(ev.target) && !ev.target.closest('.seg .caja')) { MENU.remove(); MENU = null; } });
function segmentador(pag, id, x, w, etiqueta, arbol, campo, alCambiar) {
  // arbol: [{t:texto, v:valor, h:[...]}] ; selección: Set de valores hoja (null = Todas)
  const d = document.createElement('div'); d.className = 'seg'; Object.assign(d.style, {left: x + 'px', width: w + 'px'});
  d.innerHTML = '<div class="lbl">' + esc(etiqueta) + '</div><div class="caja"><span>Todas</span><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5l5 5 5-5" fill="none" stroke="#252423" stroke-width="1.3"/></svg></div>';
  pag.appendChild(d);
  const hojas = n => n.h ? n.h.flatMap(hojas) : [n.v];
  const todas = arbol.flatMap(hojas);
  const caja = d.querySelector('.caja'), txt = caja.querySelector('span');
  const sel = () => ESTADO[id][campo];
  function rotulo() { const s = sel(); if (!s) { txt.textContent = 'Todas'; return; } const n = [...s]; txt.textContent = n.length === 1 ? (buscar(arbol, n[0]) || '1 seleccionado') : 'Varias selecciones'; }
  function buscar(a, v) { for (const n of a) { if (n.v === v && !n.h) return n.t; if (n.h) { const r = buscar(n.h, v); if (r) return r; } } return null; }
  caja.onclick = () => {
    if (MENU) { MENU.remove(); MENU = null; return; }
    const m = document.createElement('div'); m.className = 'menu'; const r = caja.getBoundingClientRect();
    m.style.left = r.left + 'px'; m.style.top = (r.bottom + 2) + 'px'; m.style.minWidth = Math.max(220, r.width) + 'px';
    const abiertos = new Set();
    function dibujar() {
      const s = sel(); let html = '<label><input type="checkbox" data-a="todas"' + (!s ? ' checked' : '') + '> Seleccionar todo</label>';
      (function rec(a, niv) { for (const n of a) { const hs = hojas(n); const marcadas = s ? hs.filter(v => s.has(v)).length : hs.length;
        html += '<label class="n' + niv + '">' + (n.h ? '<span class="exp" data-e="' + esc(n.t + niv) + '">' + (abiertos.has(n.t + niv) ? '▾' : '▸') + '</span>' : '<span class="exp"></span>')
          + '<input type="checkbox" data-h="' + esc(JSON.stringify(hs)) + '"' + (marcadas === hs.length ? ' checked' : '') + (marcadas > 0 && marcadas < hs.length ? ' data-ind="1"' : '') + '> ' + esc(n.t) + '</label>';
        if (n.h && abiertos.has(n.t + niv)) rec(n.h, niv + 1); } })(arbol, 1);
      m.innerHTML = html; m.querySelectorAll('[data-ind]').forEach(i => i.indeterminate = true);
    }
    m.addEventListener('click', ev => {
      const e = ev.target.closest('[data-e]'); if (e) { ev.preventDefault(); const k = e.getAttribute('data-e'); abiertos.has(k) ? abiertos.delete(k) : abiertos.add(k); dibujar(); return; }
      const i = ev.target.closest('input'); if (!i) return;
      if (i.getAttribute('data-a') === 'todas') ESTADO[id][campo] = null;
      else { const hs = JSON.parse(i.getAttribute('data-h')); let s = sel() ? new Set(sel()) : new Set(todas); if (s.size === todas.length && sel() === null) s = new Set(); const todasDentro = hs.every(v => s.has(v)) && sel() !== null;
        if (todasDentro) hs.forEach(v => s.delete(v)); else hs.forEach(v => s.add(v)); ESTADO[id][campo] = (s.size === 0 || s.size === todas.length) ? null : s; }
      dibujar(); rotulo(); alCambiar(); ajustar(pag);
    });
    dibujar(); document.body.appendChild(m); MENU = m;
  };
  rotulo();
}
function arbolServicios(rows, esGlosa) {
  const m = new Map(); for (const r of rows) { if (!m.has(r.s)) m.set(r.s, new Set()); m.get(r.s).add(r.p); }
  return [...m.keys()].sort((a, b) => a - b).map(s => ({t: sv(s), v: 's' + s, h: [...m.get(s)].sort((a, b) => pg(a).localeCompare(pg(b))).map(p => ({t: pg(p), v: s + '|' + p}))}));
}

// ---------------------------------------------------------------- gráficos SVG
function svg(w, h, inner) { return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + inner + '</svg>'; }
function txt(x, y, s, o) { o = o || {}; return '<text x="' + x + '" y="' + y + '" font-size="' + (o.fs || 9) + 'pt" fill="' + (o.c || '#605E5C') + '" text-anchor="' + (o.a || 'start') + '"' + (o.b ? ' font-weight="bold"' : '') + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : '') + ' dominant-baseline="' + (o.db || 'middle') + '">' + esc(s) + '</text>'; }
function leyenda(w, y, items) { let tot = 0; const anchos = items.map(it => it[0].length * 6.6 + 18); tot = anchos.reduce((a, b) => a + b, 0); let x = (w - tot) / 2, s = '';
  items.forEach((it, i) => { s += '<circle cx="' + (x + 5) + '" cy="' + y + '" r="5" fill="' + it[1] + '"/>' + txt(x + 12, y, it[0], {fs: 9, c: '#605E5C'}); x += anchos[i]; }); return s; }
function cortar(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// barras horizontales agrupadas: cats [{n, a:[valores]}], series [[nombre,color]]
function barrasH(cont, cats, series, op) {
  op = op || {}; const W = cont.clientWidth || op.w, H = cont.clientHeight || op.h;
  const izq = op.izq || 90, der = 70, arr = 6, abj = op.sinEjeX ? 30 : 58; const aw = W - izq - der, ah = H - arr - abj;
  const max = Math.max(1, ...cats.flatMap(c => c.a)); const st = paso(max, 3); const tope = Math.max(max * 1.04, Math.floor(max / st) * st);
  const bandas = ah / Math.max(cats.length, 1); const ns = series.length; const bh = Math.min(op.bh || 14, (bandas * 0.8) / ns);
  let s = '';
  if (!op.sinEjeX) for (let v = 0; v <= tope * 1.0001; v += st) { const x = izq + v / tope * aw; s += '<line x1="' + x + '" y1="' + arr + '" x2="' + x + '" y2="' + (arr + ah) + '" stroke="#E1DFDD" stroke-dasharray="1,3"/>' + txt(x, arr + ah + 10, op.fx ? op.fx(v) : fN(v), {a: 'middle'}); }
  cats.forEach((c, i) => { const yc = arr + bandas * i + bandas / 2; s += txt(izq - 8, yc, cortar(c.n, op.corte || 30), {a: 'end', fs: 9.5});
    c.a.forEach((v, j) => { const y = yc - (ns * bh) / 2 + j * bh; const w = Math.max(0, v / tope * aw);
      s += '<rect x="' + izq + '" y="' + y + '" width="' + w + '" height="' + (bh - 1) + '" fill="' + series[j][1] + '" data-tip="' + esc('<b>' + c.n + '</b><br>' + series[j][0] + ': ' + fN(v)) + '"/>';
      if (!op.sinEtiq) { const lw = fN(v).length * 6.6 + 6; const dentro = izq + w + lw > W - 2; s += txt(dentro ? izq + w - 4 : izq + w + 4, y + bh / 2, fN(v), {a: dentro ? 'end' : 'start', c: dentro ? '#fff' : '#605E5C', fs: 9}); } }); });
  if (!op.sinEjeX) s += txt(izq + aw / 2, arr + ah + 28, op.tx || 'Monto M$', {a: 'middle', c: '#252423', fs: 9});
  if (op.ty) s += txt(14, arr + ah / 2, op.ty, {a: 'middle', rot: -90, c: '#252423'});
  if (series.length && !op.sinLeyenda) s += leyenda(W, H - 10, series);
  cont.innerHTML = svg(W, H, s);
}
// barras 100 % apiladas horizontales con desplazamiento: cats [{n, ej, sal}]
function apiladas100(cont, cats, op) {
  op = op || {}; const W = cont.clientWidth, H = cont.clientHeight; const izq = op.izq || 180, der = 30, arr = 10, abj = 58, alto = 26;
  const aw = W - izq - der; const areaH = H - arr - abj; const total = cats.length * alto;
  let s = ''; cats.forEach((c, i) => { const y = i * alto + 4; const tot = Math.max(c.ej, 0) + Math.max(c.sal, 0); const pe = tot ? Math.max(c.ej, 0) / tot : 0; const ps = tot ? 1 - pe : 0;
    s += txt(izq - 8, y + 9, cortar(c.n, op.corte || 42), {a: 'end', fs: 9.5});
    if (tot) { s += '<rect x="' + izq + '" y="' + y + '" width="' + pe * aw + '" height="18" fill="' + C1 + '" data-tip="' + esc('<b>' + c.n + '</b><br>Ejecución: ' + fN(c.ej) + ' (' + fP(pe) + ')') + '"/>';
      s += '<rect x="' + (izq + pe * aw) + '" y="' + y + '" width="' + ps * aw + '" height="18" fill="' + C2 + '" data-tip="' + esc('<b>' + c.n + '</b><br>Saldo: ' + fN(c.sal) + ' (' + fP(ps) + ')') + '"/>';
      if (pe > 0.04) s += txt(izq + pe * aw / 2, y + 9, (pe * 100).toFixed(1).replace('.', ',') + '%', {a: 'middle', c: '#fff'});
      if (ps > 0.04) s += txt(izq + pe * aw + ps * aw / 2, y + 9, (ps * 100).toFixed(1).replace('.', ',') + '%', {a: 'middle', c: '#fff'}); } });
  let ejes = ''; const marcas = op.marcas || [0, .2, .4, .6, .8, 1];
  marcas.forEach(v => { const x = izq + v * aw; ejes += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (Math.min(total, areaH)) + '" stroke="#E1DFDD" stroke-dasharray="1,3"/>' + txt(x, Math.min(total, areaH) + 14, fP0(v), {a: 'middle'}); });
  ejes += leyenda(W, Math.min(total, areaH) + 46, [['Ejecución', C1], ['Saldo', C2]]);
  if (op.ty) ejes += txt(10, Math.min(total, areaH) / 2, op.ty, {a: 'middle', rot: -90, c: '#252423'});
  cont.innerHTML = '<div style="position:absolute;left:0;top:' + arr + 'px;pointer-events:none">' + svg(W, H - arr, ejes) + '</div>'
    + '<div class="desliza" style="left:0;top:' + arr + 'px;width:' + W + 'px;height:' + Math.min(total, areaH) + 'px">' + svg(W, total, s) + '</div>';
}
// columnas: cats [{n, v}], op.pct
function columnas(cont, cats, op) {
  op = op || {}; const W = cont.clientWidth, H = cont.clientHeight; const izq = op.izq || 60, der = 14, arr = 24, abj = 26; const aw = W - izq - der, ah = H - arr - abj;
  const max = op.pct ? 1 : Math.max(1, ...cats.map(c => c.v)); const st = op.pct ? 0.5 : paso(max, 1.6); const tope = op.pct ? 1 : Math.max(max * 1.08, Math.floor(max / st) * st);

function tablaJerarquica(cont, rows, id) {

    const a = agrupa(rs.filter(r => r.as >= 0 && nas(r.as)), r => r.as, ['ley', 'vig', 'dev']).sort((x, y) => nas(x.k).localeCompare(nas(y.k), 'es', {numeric: true}));
    apiladas100(ap, a.map(x => ({n: nas(x.k), ej: x.dev, sal: x.vig - x.dev})), {izq: 450, corte: 60, ty: 'Nombre Asignación', marcas: [0, .5, 1]});
    tablaSimple(tb, a.map(x => ({n: nas(x.k), ley: x.ley, vig: x.vig, dev: x.dev})), [], {cab: 'Nombre Asignación', alinCab: 'center', iconos: true, fs: 10.5, ancho1: 40});
    const s = agrupa(rs, r => r.s, ['vig', 'dev']).sort((x, y) => x.k - y.k);
    barrasH(bs, s.map(x => ({n: sv(x.k), a: [x.vig, x.dev]})), [['Presupuesto Vigente', C1], ['Ejecución', C2]], {izq: 90, ty: 'Servicio', bh: 34}); }
  segmentador(P, id, 882, 270, 'Servicio, Programa', arbolServicios(BASEP), 'prog', dibujar);
  pag.dibujar = dibujar;
})();

// 6. Presupuesto Regional
(function () { const pag = nuevaPagina('Presupuesto Regional'); const P = pag.p; const id = 'reg'; ESTADO[id] = {prog: null, reg: null, cla: null};
  cabecera(P, 'Ejecución Presupuestaria de Gastos Regional en M$', 610);
  const BASER = BASE.filter(r => r.t === GASTOS);
  const tb = marco(P, 7, 73, 677, 337, 'Ejecución por Servicio y Región', 14); const br = marco(P, 693, 73, 352, 337, 'Ejecución por Región', 14);
  const cb = marco(P, 7, 421, 1038, 287, 'Presupuesto Asignado y Ejecución por Región', 14); const mp = marco(P, 1051, 73, 225, 635, 'Mapa de Ejecución', 14);
  let mapa = null, capa = null;
  function tablaRegion(rs) { const servs = [...new Set(BASER.map(r => r.s))].sort((a, b) => a - b); const regs = [...new Set(rs.map(r => r.c))].sort((a, b) => a - b);
    let h = '<table class="pv fija" style="font-size:8.5pt"><colgroup><col style="width:17%">' + '<col>'.repeat(servs.length) + '<col style="width:13%"></colgroup><thead><tr><th style="text-align:left">Región</th>' + servs.map(s => '<th>' + esc(sv(s)) + '</th>').join('') + '<th>Total</th></tr></thead><tbody>';
    const tot = {}; servs.forEach(s => tot[s] = 0);
    regs.forEach(c => { const x = rs.filter(r => r.c === c); let t = 0; h += '<tr><td class="et">' + esc(reg(c)) + '</td>' + servs.map(s => { const v = suma(x.filter(r => r.s === s), 'dev'); tot[s] += v; t += v; return '<td>' + (v ? fN(v) : '') + '</td>'; }).join('') + '<td style="font-weight:700">' + fN(t) + '</td></tr>'; });
    const T0 = servs.reduce((a, s) => a + tot[s], 0); h += '<tr class="tot"><td class="et">Total</td>' + servs.map(s => '<td>' + fN(tot[s]) + '</td>').join('') + '<td>' + fN(T0) + '</td></tr></tbody></table>';
    tb.innerHTML = '<div class="desliza" style="inset:0 4px 4px 8px">' + h + '</div>'; }
  function dibujar() { const rs = filtrar(id, BASER); tablaRegion(rs);
    const sinNC = rs.filter(r => reg(r.c) !== 'Nivel Central');
    const g = agrupa(sinNC, r => r.c, ['dev', 'req']);
    barrasH(br, g.slice().sort((a, b) => b.dev - a.dev).map(x => ({n: reg(x.k), a: [x.dev]})), [['Ejecución', C1]], {izq: 100, bh: 17, sinLeyenda: true, corte: 14, tx: 'Monto M$'});
    combinado(cb, g.slice().sort((a, b) => a.k - b.k).map(x => ({n: reg(x.k), dev: x.dev, req: x.req})));
    if (window.L) { if (!mapa) { mapa = L.map(mp, {zoomControl: false, attributionControl: true}).setView([-37.5, -71.5], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 10, attribution: '© OpenStreetMap'}).addTo(mapa); }
      if (capa) capa.remove(); capa = L.layerGroup().addTo(mapa); const gm = agrupa(sinNC, r => r.m, ['dev']); const mx = Math.max(1, ...gm.map(x => x.dev));
      gm.forEach(x => { const co = D.coords[mapa_nombre(x.k)]; if (!co || x.dev <= 0) return; L.circleMarker(co, {radius: 4 + 14 * Math.sqrt(x.dev / mx), color: '#12239E', weight: 1, fillColor: C1, fillOpacity: .85})
        .bindTooltip('<b>' + esc(mapa_nombre(x.k)) + '</b><br>Ejecución: ' + fN(x.dev)).addTo(capa); });
      setTimeout(() => mapa.invalidateSize(), 50); }
    else mp.innerHTML = '<div style="padding:20px;color:#605E5C;font-size:10pt;text-align:center">El mapa necesita conexión a internet.</div>'; }
  function mapa_nombre(i) { return T.mapa[i]; }
  segmentador(P, id, 684, 199, 'Servicio, Programa', arbolServicios(BASER), 'prog', dibujar);
  segmentador(P, id, 882, 172, 'Región', [...new Set(BASER.map(r => r.c))].sort((a, b) => a - b).map(c => ({t: reg(c), v: c})), 'reg', dibujar);
  // subtítulo > ítem > asignación (solo filas con asignación, como en el informe)
  const arbol = (function () { const m = new Map(); for (const r of BASER) { if (!nas(r.as)) continue; const a = nst(r.st), b = nit(r.it); if (!m.has(a)) m.set(a, new Map()); const mi = m.get(a); if (!mi.has(b)) mi.set(b, new Map()); mi.get(b).set(r.st + '|' + r.it + '|' + r.as, nas(r.as)); }
    return [...m.keys()].sort().map(a => ({t: a, v: a, h: [...m.get(a).keys()].sort().map(b => ({t: b, v: a + b, h: [...m.get(a).get(b).entries()].sort((x, y) => x[1].localeCompare(y[1])).map(([v, t]) => ({t, v}))}))})); })();
  segmentador(P, id, 1054, 225, 'Subtítulo, Ítem, Asignación', arbol, 'cla', dibujar);
  pag.dibujar = dibujar; pag.alMostrar = () => mapa && setTimeout(() => mapa.invalidateSize(), 50);
})();

// ---------------------------------------------------------------- navegación y escala
const BP = document.getElementById('barra-paginas');
PAGINAS.forEach((x, i) => { const b = document.createElement('button'); b.textContent = x.nombre; b.onclick = () => ir(i); BP.appendChild(b); });
const pie = document.createElement('span'); pie.className = 'pie'; pie.textContent = 'Cifras en miles de pesos · ' + D.pie; BP.appendChild(pie);
function escalar() { const s = Math.min(innerWidth / 1280, (innerHeight - 34) / 720); ESC.style.width = '1280px'; ESC.style.height = '720px'; ESC.style.transform = 'scale(' + s + ')'; ESC.style.marginLeft = Math.max(0, (innerWidth - 1280 * s) / 2) + 'px'; document.body.style.height = (720 * s + 34) + 'px'; }
addEventListener('resize', escalar); escalar();
addEventListener('keydown', ev => { const i = PAGINAS.findIndex(x => x.p.classList.contains('activa')); if (ev.key === 'ArrowRight' && i < PAGINAS.length - 1) ir(i + 1); if (ev.key === 'ArrowLeft' && i > 0) ir(i - 1); });
ir(Math.max(0, Math.min(PAGINAS.length - 1, (parseInt((location.hash || '').replace('#p', '')) || 1) - 1)));
</script>
