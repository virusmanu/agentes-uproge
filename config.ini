; Configuración del Agente de Ejecución Presupuestaria MINAGRI
; Ajuste estas rutas UNA vez, con las rutas de SU computador (carpetas sincronizadas de SharePoint).
; No use comillas. Puede copiar la ruta desde el Explorador: clic derecho sobre la carpeta > "Copiar como ruta" (y quite las comillas).

[RUTAS]
; Carpeta que contiene las carpetas de cada mes ("01 Enero 2026", "02 Febrero 2026", ...)
carpeta_informes =

; Carpeta con las 6 planillas "0X SERVICIO Presupuesto Vigente 2026.xlsx"
carpeta_presupuesto_vigente =

; (Opcional) Carpeta de informes del AÑO ANTERIOR, para comparar las Ideas Fuerza con igual mes del año pasado.
; Si en la carpeta MINAGRI del mes existe el "Cuadro Comparativo", se usa ese y esta ruta no es necesaria.
carpeta_informes_anio_anterior =

; Catálogo Maestro. Si se deja vacío, se usa el que viene en esta carpeta.
catalogo =

; (Opcional) Carpeta compartida donde se dejan los .zip de actualización del agente (por ejemplo, una carpeta de SharePoint).
; Si se configura, la ventana avisa al abrirse cuando hay una versión nueva.
carpeta_actualizaciones =

; (Opcional) Repositorio de GitHub de donde se descargan las versiones nuevas, en la forma usuario/repositorio.
; Si se deja vacío se usa el que trae el programa.
repositorio_github =

; (Opcional) Carpeta con los PDF de los decretos de modificación (por ejemplo, DECRETOS - AUTORIZACIONES 2026\DECRETOS).
; El agente verifica la fecha de toma de razón de cada decreto: primero busca aquí y, si no lo encuentra, lo descarga de DIPRES.
carpeta_decretos =
